max_turns: 8
top_k: 100
rrf_k: 60
llm_concurrency: 100
concept_bonus: 0.0025
weights:
  bm25: 0.25
  vector: 1
  entity: 0.1
  ontology: 0
faiss:
  hnsw_m: 32
  ef_construction: 200
  ef_search: 64
spacy:
  model: en_core_web_lg
ontology:
  split_threshold: 60
  max_depth: 4
  max_k_children: 3
  min_level_for_mount: 2
  top_k_recall: 20
  top_k_mount: 2
  search_top_k_nodes: 40
  include_desc_in_mount_prompt: true
  include_desc_in_search_prompt: true
  search_max_docs_per_node: 8
  search_trace_enabled: true
  search_node_similarity_weight: 0.15
  search_doc_similarity_weight: 1.0
  concurrency: 24
  batch_size: 64
  min_cluster_k: 10
  max_cluster_k: 60
  min_docs_to_split: 100
ontology_enabled: true

# --- Compression module (plug-and-play) ---
# Set enabled: true to activate pre-compression before the Verifier.
# hard_method: 'embedding' uses sentence-level cosine filtering (RECOMP-style, no extra deps).
#              'llmlingua' uses token-level perplexity filtering (requires: pip install llmlingua).
compression:
  enabled: false
  hard_method: "embedding"      # embedding | cross_encoder | llmlingua
  similarity_threshold: 0.3     # [embedding] cosine cutoff; [cross_encoder] score cutoff (0.0–1.0)
  cross_encoder_model: "BAAI/bge-reranker-v2-m3"  # [cross_encoder] HuggingFace model ID
  compression_rate: 0.5         # [llmlingua] fraction of tokens to retain
  skip_short_docs: 150          # docs with fewer words than this are passed through unchanged
  embedding_batch_size: 32      # [embedding] sentences per GPU batch; lower this if OOM
  local_model_dir: "models/llmlingua2"  # [llmlingua] local cache path; downloaded from HuggingFace on first use
